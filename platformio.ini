; PlatformIO Project Configuration File
;
; SI4684 FM/DAB receiver. Application diagnostics are runtime-gated by the
; bare DEBUG serial command; Arduino-core chatter is limited to errors.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
extra_scripts = post:scripts/complete_image.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DPNG_MAX_BUFFERED_PIXELS=2600
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_RST=-1
    -DSPI_FREQUENCY=27000000
    -DSMOOTH_FONT=1

lib_deps =
    paulstoffregen/Time
    bodmer/TFT_eSPI
    bitbank2/PNGdec

; Only the radio clock differs; TFT VSPI settings remain inherited.
[env:esp32dev_spi5]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DRADIO_SPI_HZ=5000000UL

; Full per-opcode statistics for controlled service measurements.
; This costs extra DRAM; verify Core allocation before using it for RF tests.
[env:esp32dev_diag]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSI4684_DIAG_DETAIL=1
